name: Sync to Google Sheets

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Create credentials.json
        env:
          CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -d ollaa-web-scraper/ollaa-web-scraper ]; then
            printf '%s\n' "$CREDS" > ollaa-web-scraper/ollaa-web-scraper/credentials.json
          else
            printf '%s\n' "$CREDS" > ollaa-web-scraper/credentials.json
          fi

      - name: Sync data to Google Sheets
        env:
          GOOGLE_SHEETS_ENABLED: "true"
          GOOGLE_SHEETS_SPREADSHEET_ID: "14kN2IShbo2D9f3L-ZXO9mMaKaBvO589kHnFRwcPeSOg"
          PYTHONPATH: ${{ github.workspace }}/ollaa-web-scraper
        run: |
          if [ -d ollaa-web-scraper/ollaa-web-scraper ]; then
            cd ollaa-web-scraper/ollaa-web-scraper
          else
            cd ollaa-web-scraper
          fi
          python etl/unified_exporter.py

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f ollaa-web-scraper/credentials.json
          rm -f ollaa-web-scraper/ollaa-web-scraper/credentials.json
